[package]
name = "ikigai-text"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Unix-like text endpoints (urn:text:wc/head/tail/grep/sort/uniq/nl/rev) for ikigai — pure, cacheable, wasm-clean pipeline citizens that make the REPL a coreutils analog."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-text"
homepage = "https://github.com/ikigai-rs/ikigai-text"
readme = "README.md"
keywords = ["ikigai", "roc", "text", "coreutils", "module"]
categories = ["wasm", "text-processing"]

[dependencies]
# The released kernel, consumed from crates.io — the SAME version the hosts use,
# so a host links exactly one `ikigai-core` (no duplicate-crate type mismatch).
# 0.1.89 is the floor for `space_iri` (the `urn:iki:space:` convention) and for
# `bind` dropping a space's name, which `space()` relies on: it names itself LAST.
# As a 0.x caret this is also a ceiling (<0.2.0).
ikigai-core = "0.1.89"

[dev-dependencies]
futures = "0.3"
# The module recipe as one test (`tests/conformance.rs`): walks every bound
# endpoint and reports every violation at once. 0.6.0 is the first release with
# SPACE-NAME (`self_named_space`); as a 0.x caret it is also a ceiling (<0.7.0).
ikigai-conformance = "0.6.0"
