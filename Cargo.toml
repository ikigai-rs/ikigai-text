[package]
name = "ikigai-text"
version = "0.4.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Unix-like text endpoints (urn:text:wc/head/tail/grep/sort/uniq/nl/rev) for ikigai — pure, cacheable, wasm-clean pipeline citizens that make the REPL a coreutils analog."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-text"
homepage = "https://github.com/ikigai-rs/ikigai-text"
readme = "README.md"
keywords = ["ikigai", "roc", "text", "coreutils", "module"]
categories = ["wasm", "text-processing"]

[dependencies]
# The released kernel, consumed from crates.io — the SAME version the hosts use,
# so a host links exactly one `ikigai-core` (no duplicate-crate type mismatch).
# 0.2.3 adds ArgSpec::reads_body: a live piped `in` reaches the tool
# without the kernel collecting it first. This declaration changes all eight
# text tools' contract IRIs. As a 0.x caret this also sets a ceiling (<0.3.0).
ikigai-core = "0.2.3"
# Both already in the graph through ikigai-core: `async-trait` to implement
# `Endpoint` (its body path, `invoke_body`), `futures-util` to build the streamed
# answer (ledger #2275). Runtime-free, so the crate stays wasm-clean.
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
futures = "0.3"
# The module recipe as one test; 0.12.0 enables BODIES and BODY-INPUTS
# alongside the existing checks. Its core floor applies only to the test build.
ikigai-conformance = "0.12.0"
